name: CI Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  # ============================================================
  # BUILD + TEST + SONARQUBE
  # ============================================================
  build-and-analyze:
    name: Build, Test, and SonarQube Analysis
    runs-on: ubuntu-latest

    environment:
      name: SONARQUBE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Grant permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Create .env from Secret
        shell: bash
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          set -Eeuo pipefail

          if [ -z "$ENV_CONTENT" ]; then
            echo "ERROR: ENV_FILE secret is empty"
            exit 1
          fi

          printf '%s\n' "$ENV_CONTENT" > .env
          chmod 600 .env

          echo ".env created successfully"

      - name: Build, Test, and Run SonarQube Analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -Eeuo pipefail

          ./gradlew \
            clean \
            build \
            sonar \
            --info \
            --no-daemon

      - name: Remove temporary .env
        if: always()
        shell: bash
        run: |
          rm -f .env

  # ============================================================
  # DEPLOY (dev only) — calls cd.yaml as a reusable workflow rather than
  # inlining deploy steps here, so CD's actual logic still lives in exactly
  # one place (cd.yaml), reusable both from here and from a manual dispatch.
  # Deliberately NOT a workflow_run trigger on cd.yaml's side: workflow_run
  # loads the workflow file from the repo's default branch (main here), not
  # from dev, which silently ran a long-stale deploy script once dev's copy
  # of cd.yaml diverged from main's. A `uses:` job like this one instead runs
  # the callee using the SAME ref/commit as this run — i.e. whatever is
  # actually on dev right now.
  # ============================================================
  deploy:
    name: Deploy Backend to AWS
    needs: build-and-analyze
    # Only dev is automatically deployed. A pull_request run's github.ref is
    # a refs/pull/.../merge ref, so it already fails this check on its own —
    # no separate exclusion needed for PRs (or for pushes to any other branch).
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/cd.yaml
    secrets: inherit


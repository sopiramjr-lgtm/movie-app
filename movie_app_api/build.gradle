plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.movie_app'
version = '0.0.1-SNAPSHOT'
description = 'movie_app_api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

// === OpenAPI & Swagger / Scalar Documentation ===
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // Keycloak Admin Client for managing users, roles, and passwords
    implementation 'org.keycloak:keycloak-admin-client:24.0.1'

    // === Database Migration (Flyway) ===
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // === Core Spring Boot Starters ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // === Security & Authentication (Keycloak) ===
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // Added: Required for validating Keycloak JWTs
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // === Database ===
    runtimeOnly 'org.postgresql:postgresql'

    // === Storage (MinIO) ===
    // Added: For uploading/streaming videos and images
    implementation 'io.minio:minio:8.5.7'

    // === Utilities ===
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    // Added: For validating DTOs (e.g., @NotBlank, @NotNull)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // === Testing ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}